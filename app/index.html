<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VICE HEAT Cover Studio</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brandmark">VICE HEAT</span> Cover Studio</div>
  <p class="tagline">Your photos into GTA-style cover art — offline, nothing is uploaded.</p>
</header>
<main class="app">
  <section class="controls" aria-label="Editor controls">
    <h2>1 · Photos</h2>
    <div class="row">
      <label class="filebtn">Add photos
        <input id="addphotos" type="file" accept="image/*" multiple>
      </label>
      <button id="loadsamples" type="button">Load samples</button>
    </div>
    <p id="photocount" class="hint">Loading samples…</p>
    <div id="photostrip" class="photostrip"></div>

    <h2>2 · Layout</h2>
    <div id="layoutbtns" class="layoutbtns">
      <button type="button" data-layout="comic" class="on">
        <span class="mini comic"><i></i><i></i><i></i><i></i><i></i></span>Comic Grid
      </button>
      <button type="button" data-layout="feature">
        <span class="mini feature"><i></i><i></i><i></i></span>Feature
      </button>
      <button type="button" data-layout="hero">
        <span class="mini hero"><i></i><i></i><i></i></span>Hero + Strips
      </button>
      <button type="button" data-layout="quad">
        <span class="mini quad"><i></i><i></i><i></i><i></i></span>Quad
      </button>
    </div>

    <h2>3 · Grade</h2>
    <div id="gradebtns" class="gradebtns">
      <button type="button" data-grade="sunset" class="on"><span class="sw sunset"></span>Sunset</button>
      <button type="button" data-grade="neon"><span class="sw neon"></span>Neon</button>
      <button type="button" data-grade="vice"><span class="sw vice"></span>Vice Pink</button>
      <button type="button" data-grade="heatwave"><span class="sw heatwave"></span>Heatwave</button>
    </div>

    <h2>4 · Caption</h2>
    <label>Title
      <input id="title" type="text" maxlength="48" value="Vice Heat">
    </label>
    <label>Tagline
      <input id="subtitle" type="text" maxlength="60" value="Vice City Nights">
    </label>

    <h2>5 · Selected panel</h2>
    <div id="panelpicker" class="panelpicker"></div>
    <label>Photo in this panel
      <select id="panelphoto"></select>
    </label>
    <label>Zoom <span class="range"><input id="zoom" type="range" min="100" max="250" value="100"><b id="zoomval">100%</b></span></label>
    <label>Pan left–right <span class="range"><input id="panx" type="range" min="0" max="100" value="50"><b id="panxval">50%</b></span></label>
    <label>Pan up–down <span class="range"><input id="pany" type="range" min="0" max="100" value="50"><b id="panyval">50%</b></span></label>
    <p class="hint">Tip: click a panel in the preview to select it, then drag it to pan the photo.</p>

    <h2>6 · Export</h2>
    <div id="sizebtns" class="sizebtns">
      <button type="button" data-size="1080x1080">1080 × 1080</button>
      <button type="button" data-size="1080x1350">1080 × 1350</button>
      <button type="button" data-size="1920x1080" class="on">1920 × 1080</button>
    </div>
    <div id="exportbtns" class="exportbtns">
      <button type="button" data-export="1080x1080">Export PNG · 1080 × 1080</button>
      <button type="button" data-export="1080x1350">Export PNG · 1080 × 1350</button>
      <button type="button" data-export="1920x1080">Export PNG · 1920 × 1080</button>
    </div>
    <p id="status" role="status"></p>
  </section>
  <section class="preview" aria-label="Live preview">
    <canvas id="cover" width="900" height="506" aria-label="The cover"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
